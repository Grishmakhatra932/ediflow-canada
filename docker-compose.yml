services:

  db:
    image: postgres:17
    container_name: ediflow-postgres

    environment:
      POSTGRES_DB: ediflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ediflow"]
      interval: 5s
      timeout: 5s
      retries: 5


  api:
    build: .
    container_name: ediflow-api

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/ediflow
      API_KEY: ${API_KEY}

    ports:
      - "8000:8000"


  prometheus:
    image: prom/prometheus:latest
    container_name: ediflow-prometheus

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    ports:
      - "9090:9090"

    depends_on:
      - api


  grafana:
    image: grafana/grafana:latest
    container_name: ediflow-grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    volumes:
      - grafana_data:/var/lib/grafana


volumes:
  postgres_data:
  grafana_data: