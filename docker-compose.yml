services:

  db:
    image: postgres:17
    container_name: ediflow-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  api:
    build: .
    container_name: ediflow-api

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      API_KEY: ${API_KEY}
      ERP_FAILURE_MODE: ${ERP_FAILURE_MODE}

    ports:
      - "8000:8000"


  prometheus:
    image: prom/prometheus:latest
    container_name: ediflow-prometheus

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    ports:
      - "9090:9090"

    depends_on:
      - api


  grafana:
    image: grafana/grafana:latest
    container_name: ediflow-grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    volumes:
      - grafana_data:/var/lib/grafana


volumes:
  postgres_data:
  grafana_data: